<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wanderings">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:#FFFFFF}
img{max-width:100%}
[hidden]{display:none!important}

<body>

<style>
/* Light only by design decision (Oct 7). Layout: single-column phone app, editorial rules instead of cards, fixed 5-tab bar. Peacock dominant, coral only for discovery and memories. */
:root{
  --bg:#FFFFFF; --surface:#F5F7F7; --ink:#23262A; --muted:#5F656C; --faint:#80878E; --rule:#E3E5E8;
  --accent:#00677A; --accent-deep:#004C59; --accent-soft:#E3F0F2; --on-accent:#FFFFFF; --route:#A9C8CE;
  --coral:#E5573E; --coral-ink:#B5391F; --amber:#E0A100; --amber-ink:#7A5200; --green:#3E8E55; --green-ink:#2C6A3E; --panel:#23262A; --panel-ink:#FFFFFF; --panel-muted:#B7BCC2;
  --sans:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
:root,:root[data-theme="dark"]{color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-deep)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 20px calc(100px + env(safe-area-inset-bottom,0px))}
section[data-tab]{display:flex;flex-direction:column}

/* type */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep)}
.label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.label.coral{color:var(--coral-ink)}
h1{margin:0;font-size:38px;line-height:1.02;font-weight:700;letter-spacing:-.035em;text-wrap:balance}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:600}
.lede{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.32;color:var(--muted)}
.serif{font-family:var(--serif);font-style:italic}
.small{font-size:13px}.muted{color:var(--muted)}.faint{color:var(--faint)}
p{margin:0}
.block{padding-top:34px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 0 6px}
.word{font-weight:700;font-size:17px;letter-spacing:-.01em}.word span{color:var(--accent)}
.stamp{display:flex;align-items:center;gap:10px;color:var(--accent-deep)}
.stamp .t{display:flex;flex-direction:column;gap:3px;border-left:1px solid var(--rule);padding-left:10px}
.stamp b{font-size:12px;font-weight:600;letter-spacing:.32em;color:var(--ink)}
.stamp i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.greet{padding:16px 0 18px;display:flex;flex-direction:column;gap:8px}

/* illustrations */
.ink{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
.wash{fill:var(--accent);fill-opacity:.13;stroke:none}
.hero{margin:0 -20px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);position:relative}
.hero svg{display:block;width:100%;height:auto}
.hero .cap{position:absolute;left:20px;top:12px}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--rule)}
.rows > .row:last-child{border-bottom:1px solid var(--rule)}
.row > div{min-width:0}
.row .ill{width:52px;height:52px}
.row .meta{font-size:12.5px;color:var(--muted)}
.row .desc{font-size:13.5px;color:var(--muted);margin-top:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.price{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* controls */
.btn{border:0;border-radius:999px;min-height:44px;padding:0 18px;font-weight:600;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px}
.btn.line{background:transparent;border:1px solid var(--rule);color:var(--ink);font-weight:500}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-deep);border-color:transparent}
.text-btn{border:0;background:none;min-height:44px;padding:0;font-weight:600;font-size:13.5px;color:var(--accent-deep)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -20px;padding-inline:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--bg);border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=search],input[type=date],input[inputmode],textarea,select{width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--bg);padding:11px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical;font-family:var(--serif);font-size:17px;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0;flex:1 1 140px}
.fields{display:flex;gap:10px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:13.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;margin-top:18px}
.quick button{border:0;background:none;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:500}
.quick svg{width:24px;height:24px;stroke:var(--accent)}
.quick .rec span{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.quick .rec svg{width:18px;height:18px;stroke:var(--on-accent)}
.quick .rec{color:var(--accent-deep);font-weight:600}

/* note */
.note{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding-top:22px}
.note svg{width:26px;height:26px;stroke:var(--coral)}
.note .serif{font-size:16.5px;line-height:1.35}

/* phrase panel */
.panel{background:var(--panel);color:var(--panel-ink);padding:20px;margin:0 -4px;display:flex;flex-direction:column;gap:10px}
.panel .label{color:var(--panel-muted)}
.panel .it{font-size:24px;font-weight:600;letter-spacing:-.015em}
.panel .say{font-family:var(--mono);font-size:12.5px;color:var(--panel-muted)}
.panel .en{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--panel-muted)}
.panel a,.panel .text-btn{color:var(--panel-ink)}
.hear{width:48px;height:48px;border-radius:50%;border:1px solid var(--rule);background:transparent;display:grid;place-items:center;flex:none}
.panel .hear{border-color:#5A9EAA;color:var(--panel-ink)}
.hear svg{width:20px;height:20px;stroke:currentColor}

/* phrases list */
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.ph .it{font-weight:600;font-size:16px}
.ph .say{font-family:var(--mono);font-size:12px;color:var(--accent-deep);margin-top:2px}
.ph .en{font-size:13.5px;color:var(--muted);margin-top:1px}
.star{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--faint)}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{color:var(--coral)}
.star[aria-pressed="true"] svg{fill:currentColor}

/* journal */
.entry{display:flex;flex-direction:column;gap:5px;padding:16px 0;border-top:1px solid var(--rule)}
.entry .q{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.qm{font-family:var(--serif);font-size:38px;line-height:.6;height:14px;color:var(--coral)}
.summary{background:var(--surface);padding:16px;font-family:var(--serif);font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}

/* fare table */
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px}
.kv > span:nth-child(even){font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--rule);margin:4px 0}
.num{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid var(--rule);padding:4px 0}
.num .n{font-family:var(--mono);font-size:17px;user-select:all}
.conv{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.big{display:flex;align-items:center;border-bottom:2px solid var(--ink);padding:4px 0}
.big span{font-family:var(--mono);font-size:22px;color:var(--muted)}
.big input{border:0;background:transparent;font-family:var(--mono);font-size:30px;padding:6px 8px;min-width:0;font-variant-numeric:tabular-nums}
.big input:focus{outline:none}.big:focus-within{border-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.grid3 div{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.grid3 b{display:block;font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--muted)}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ul.plain li{padding:11px 0;border-top:1px solid var(--rule);font-size:14px}
ul.plain li b{display:block;font-size:14.5px}
.ph-flag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--faint);color:var(--muted);padding:2px 6px;border-radius:4px}

/* driver card */
.driver{position:fixed;inset:0;background:var(--bg);z-index:30;padding:calc(28px + env(safe-area-inset-top,0px)) 24px 24px;display:flex;flex-direction:column;gap:18px}
.driver[hidden],.toast[hidden],[hidden]{display:none!important}
.driver .big-it{font-size:40px;line-height:1.08;font-weight:700;letter-spacing:-.03em}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--rule);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;color:var(--muted);min-height:52px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button[aria-selected="true"]{color:var(--accent-deep);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.went{color:var(--accent-deep);font-weight:600;font-size:12.5px}
.daystrip{display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:4px 20px 2px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;border:1px solid var(--rule);background:var(--bg);border-radius:12px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.day .dw{font-size:11px;color:var(--muted)}.day .dn{font-size:18px;font-weight:600}
.day .dots{display:flex;gap:3px;height:4px}.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] .dw{color:#C9CDD2}.day[aria-pressed="true"] .dots i{background:var(--bg)}
.seg2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg2 button{min-height:38px;border:0;border-radius:999px;background:none;color:var(--muted);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.seg2 button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.seg2 svg{width:16px;height:16px}
.tl{position:relative;display:flex;flex-direction:column}
.tl .line{position:absolute;left:63px;top:14px;bottom:24px;border-left:1px solid var(--route)}
.stop{display:grid;grid-template-columns:48px 32px minmax(0,1fr) auto;column-gap:8px;align-items:start;position:relative}
.stop > div{min-width:0}
.stop .t{font-family:var(--mono);font-size:13px;color:var(--accent-deep);font-weight:500;padding-top:6px}
.stop .t.any{font-size:11.5px;color:var(--muted);font-weight:400;padding-top:8px}
.num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:500;box-sizing:border-box}
.num.o{background:var(--bg);border:1.5px solid var(--accent);color:var(--accent)}
.num.done{background:var(--rule);color:var(--muted)}
.leg{padding:9px 0 9px 88px;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.leg .alt{color:var(--accent-deep)}
.handle{width:40px;height:40px;border:0;background:none;color:var(--faint);display:grid;place-items:center}
.mapwrap{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.scrim{position:fixed;inset:0;background:#23262A;opacity:.38;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto}
.sheet .grab{align-self:center;width:40px;height:4px;border-radius:999px;background:#D5D9DD}
.daypick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.daypick button{min-height:56px;border:1px solid var(--rule);background:var(--bg);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.daypick button span{font-size:12px;color:var(--muted)}.daypick button b{font-size:12.5px}
.daypick button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.daypick button[aria-pressed="true"] span{color:var(--accent-deep)}
.scrim[hidden],.sheet[hidden]{display:none!important}
.when-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;color:var(--accent-deep);margin-top:6px}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--rule);border-radius:10px;padding:12px;cursor:pointer}
.opt input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.prow{display:grid;grid-template-columns:52px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.prow > div{min-width:0}
.prow .tm{font-family:var(--mono);font-size:13px;color:var(--accent-deep)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin-top:6px}
.lvl::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.lvl.required{color:var(--coral-ink)}.lvl.required::before{background:var(--coral)}
.lvl.optional{color:var(--amber-ink)}.lvl.optional::before{background:var(--amber)}
.lvl.free{color:var(--green-ink)}.lvl.free::before{background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap}.legend .lvl{margin:0;font-weight:500}
@media (prefers-reduced-motion:no-preference){section[data-tab]{animation:fade .16s ease-out}@keyframes fade{from{opacity:.5}to{opacity:1}}}
</style>

<div class="app" id="app">
  <section data-tab="today"></section>
  <section data-tab="places" hidden></section>
  <section data-tab="phrases" hidden></section>
  <section data-tab="journal" hidden></section>
  <section data-tab="essentials" hidden></section>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabbar" role="tablist"></div></nav>
<div class="driver" id="driver" hidden></div>
<div class="driver" id="welcome" hidden style="overflow:auto"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Copied'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(_){ toast('Press and hold the text to copy it'); } ta.remove(); }
}
let itVoice=null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v=>/^it([-_]|$)/i.test(v.lang));
    const score = v => (/premium/i.test(v.name)?40:0) + (/enhanced|enhanced|neural|natural/i.test(v.name)?30:0) + (/alice|federica|luca|paola|emma|google/i.test(v.name)?10:0) + (v.localService?2:0);
    itVoice = vs.sort((a,b)=>score(b)-score(a))[0] || null;
  }catch(e){ itVoice=null; }
  return itVoice;
}
try{ pickVoice(); speechSynthesis.onvoiceschanged = () => { pickVoice(); if(S && S.tab==='essentials') RENDER.essentials(); }; }catch(e){}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('Audio isn’t available in this browser'); return; }
  if(!itVoice) pickVoice();
  if(!itVoice){ toast('No Italian voice on this phone yet. See Essentials, “Pronunciation audio.”'); return; }
  try{ const u=new SpeechSynthesisUtterance(text.replace(/…/g,'').replace(/\s*\/\s*/g,', ')); u.lang=itVoice.lang; u.voice=itVoice; u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  catch(e){ toast('Audio didn’t play. Check silent mode.'); }
}
const fmtDate = (d, o={month:'short',day:'numeric'}) => new Date(d).toLocaleDateString('en-US', o);

/* ================= icons ================= */
const ICON = {

function stage(){
  const {start,end} = S.dates;
  const today = new Date(); today.setHours(0,0,0,0);
  if(!start) return {k:'before', days:null};
  const s = new Date(start+'T00:00:00'), e = end ? new Date(end+'T00:00:00') : s;
  const total = Math.round((e-s)/864e5)+1;
  if(today < s) return {k:'before', days:Math.round((s-today)/864e5), total};

}

const fmt = n => isFinite(n) ? n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '';
const num = s => parseFloat(String(s).replace(/,/g,'.').replace(/[^\d.]/g,''));
/* reference rate: European Central Bank based, via frankfurter.dev, Oct 7, 2026 */
const BASE_RATE = {v:1.1243, d:'2026-10-07T12:00:00', src:'base'};
function rateNow(){ return (S.rate && S.rate.v && (S.rate.src==='manual' || S.rate.src==='live')) ? S.rate : BASE_RATE; }
function rateLine(){
  const r = rateNow(), when = fmtDate(r.d);
  if(r.src==='manual') return `Using your own rate: €1 = $${r.v.toFixed(4).replace(/0+$/,'')} (set ${when}).`;
  if(r.src==='live') return `Based on today’s reference rate: €1 ≈ $${r.v.toFixed(2)} (European Central Bank, ${when}).`;
  return `Based on a reference rate of €1 ≈ $${r.v.toFixed(2)} (European Central Bank, ${when}). It updates automatically once the app has its own web address.`;
}
async function fetchRate(){
  try{
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 6000);
    const r = await fetch('https://api.frankfurter.dev/v2/rate/eur/usd', {signal:ctl.signal});
    if(!r.ok) return;
    const j = await r.json();
    const v = Number(j && j.rate);

    <div class="fields"><label class="f">Arrival flight (optional)<input type="text" data-bind="trip.inFlight" value="${esc(S.trip.inFlight)}" placeholder="e.g. AZ 611" autocapitalize="characters"></label><label class="f">Departure flight (optional)<input type="text" data-bind="trip.outFlight" value="${esc(S.trip.outFlight)}" placeholder="e.g. AZ 610" autocapitalize="characters"></label></div>`;
  if(wStep===3) body = `<div class="eyebrow">Step 3 of 3</div><h1>Where are you staying?</h1><p class="lede">So we can tell taxi drivers where home is and suggest what’s nearby.</p>
    <label class="f" style="flex:none">Name it<input type="text" data-bind="stays.0.label" value="${esc(sy.label)}" placeholder="e.g. Friend’s place, Hotel name"></label>
    <label class="f" style="flex:none">Neighborhood<select data-bind="stays.0.hood"><option value="">Choose…</option>${Object.entries(HOODS).map(([k,v])=>`<option value="${k}" ${sy.hood===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
    <label class="f" style="flex:none">Street address (optional, for taxi drivers)<input type="text" data-bind="stays.0.address" value="${esc(sy.address)}" placeholder="e.g. Via dei Serragli 12"></label>`;
  w.innerHTML = `<div style="display:flex;gap:6px">${dots}</div>${body}
    <div style="display:flex;gap:8px;margin-top:auto;padding-top:16px">${wStep>1?'<button class="btn line" data-wback style="flex:1">Back</button>':'<button class="btn line" data-wdone style="flex:1">Skip for now</button>'}<button class="btn" ${wStep<3?'data-wnext':'data-wdone'} style="flex:1">${wStep<3?'Next':'Done'}</button></div>`;
  w.hidden=false;
}

go(TABS.some(([k])=>k===S.tab) ? S.tab : 'today');
let forceWelcome=false; try{ forceWelcome = location.hash==='#welcome'; }catch(e){}
if(!S.onboarded || forceWelcome){ wStep=1; renderWelcome(); }
window.addEventListener('hashchange',()=>{ try{ if(location.hash==='#welcome'){ wStep=1; renderWelcome(); } }catch(e){} });
fetchRate();
})();
</script>

</body>
